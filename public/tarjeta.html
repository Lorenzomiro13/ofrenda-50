<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>Mi tarjeta · Ofrenda 50 Aniversario</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap flat" style="padding-bottom:30px">
  <div id="msg" hidden></div>
  <div class="card" id="loading"><div class="empty">Cargando tu tarjeta…</div></div>

  <article class="pass" id="pass" hidden>
    <div class="pass-top">
      <img id="logo" onerror="this.style.visibility='hidden'" alt="Escudo de la falla" src="https://stgarchivosutd.blob.core.windows.net/mailing/2Mesa_de_trabajo.png">
      <div class="eyebrow">50 aniversario</div>
      <h1>Ofrenda a la Virgen</h1>
      <div class="chip-date" id="date"></div>
    </div>
    <div class="pass-tear"></div>
    <div class="pass-body">
      <div class="pass-label">Retirada de ramo</div>
      <h2 id="name" style="margin-top:8px"></h2>
      <span class="tag" id="group"></span>
      <img class="qr" id="qr" alt="Código QR de la tarjeta">
      <div class="muted small">Código manual</div>
      <div class="pass-code" id="code"></div>
      <p class="muted small" style="margin-top:14px">Presenta esta tarjeta (en el móvil o impresa) para recoger tu ramo.</p>
    </div>
  </article>

  <div class="no-print" id="actions" hidden style="max-width:400px;margin:20px auto 0;display:grid;gap:10px">
    <button class="btn block lg" id="print" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      Descargar en PDF
    </button>
    <p class="muted small" style="text-align:center;margin:0">En el diálogo de impresión elige «Guardar como PDF».</p>
  </div>
</main>
<script src="common.js"></script>
<script>
$('print').onclick=()=>window.print();
(async()=>{
  const sp=new URLSearchParams(location.search),codigo=sp.get('codigo')||sp.get('qr');
  try{
    if(!codigo)throw Error('Falta el código de la tarjeta. Abre el enlace que recibiste por correo.');
    const d=await api('tarjeta',{codigo});
    if(d.logo)$('logo').src=d.logo;
    $('date').textContent=d.fecha;$('name').textContent=d.nombre;$('group').textContent=d.grupo;$('code').textContent=d.codigo;
    $('qr').src=d.qrUrl||('https://quickchart.io/qr?size=400&margin=1&text='+encodeURIComponent('OF50:'+d.codigo));
    $('pass').hidden=false;$('actions').hidden=false;
  }catch(e){info(e.message,true);}
  finally{$('loading').hidden=true;}
})();
</script>
</body>
</html>
