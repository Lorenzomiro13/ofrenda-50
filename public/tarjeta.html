<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>Mi tarjeta · Ofrenda 50 Aniversario</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap flat" style="padding-bottom:30px">
  <div id="msg" hidden></div>
  <div class="card" id="loading"><div class="empty">Cargando tu tarjeta…</div></div>

  <article class="pass" id="pass" hidden>
    <div class="pass-top">
      <img id="logo" onerror="this.style.visibility='hidden'" alt="Escudo de la falla" src="https://stgarchivosutd.blob.core.windows.net/mailing/2Mesa_de_trabajo.png">
      <div class="eyebrow">50 aniversario</div>
      <h1>Ofrenda a la Virgen</h1>
      <div class="chip-date" id="date"></div>
    </div>
    <div class="pass-tear"></div>
    <div class="pass-body">
      <div class="pass-label">Retirada de ramo</div>
      <h2 id="name" style="margin-top:8px"></h2>
      <span class="tag" id="group"></span>
      <img class="qr" id="qr" alt="Código QR de la tarjeta">
      <div class="muted small">Código manual</div>
      <div class="pass-code" id="code"></div>
      <p class="muted small" style="margin-top:14px">Presenta esta tarjeta (en el móvil o impresa) para recoger tu ramo.</p>
    </div>
  </article>

  <div class="no-print" id="actions" hidden style="max-width:400px;margin:20px auto 0;display:grid;gap:10px">
    <button class="btn block lg" id="png" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      Guardar imagen en el móvil
    </button>
    <button class="btn ghost block" id="print" type="button">Descargar en PDF / imprimir</button>
    <p class="muted small" style="text-align:center;margin:0">La imagen queda en tu galería y se puede enseñar sin internet.</p>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="common.js"></script>
<script>
$('print').onclick=()=>window.print();
let D=null,QRTEXT='';
function cargarImg(src){return new Promise(ok=>{if(!src)return ok(null);const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=src;});}
async function hacerPNG(){
  await (document.fonts?document.fonts.ready:Promise.resolve());
  const W=1080,H=1700,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const NAVY='#14284b',GOLD='#d9b26f';
  g.fillStyle='#f6f7fa';g.fillRect(0,0,W,H);
  // tarjeta
  const r=48,x=60,y=60,w=W-120,h=H-120;g.save();g.beginPath();g.roundRect(x,y,w,h,r);g.clip();
  g.fillStyle='#fff';g.fillRect(x,y,w,h);g.fillStyle=NAVY;g.fillRect(x,y,w,560);g.restore();
  // escudo
  const esc=await cargarImg(D.logo||ESCUDO);
  if(esc){g.fillStyle='#fffaf2';g.beginPath();g.arc(W/2,230,120,0,Math.PI*2);g.fill();g.lineWidth=8;g.strokeStyle=GOLD;g.stroke();try{const s=Math.min(190/esc.width,190/esc.height);g.drawImage(esc,W/2-esc.width*s/2,230-esc.height*s/2,esc.width*s,esc.height*s);}catch(e){}}
  g.textAlign='center';g.fillStyle='#f3d39b';g.font='800 30px Manrope, sans-serif';g.fillText('50 ANIVERSARIO',W/2,420);
  g.fillStyle='#fff';g.font='600 64px Fraunces, Georgia, serif';g.fillText('Ofrenda a la Virgen',W/2,495);
  g.font='600 32px Manrope, sans-serif';g.fillStyle='#dfe6f3';g.fillText(D.fecha||'',W/2,548);
  // nombre
  g.fillStyle='#b8863b';g.font='800 30px Manrope, sans-serif';g.fillText('RETIRADA DE RAMO',W/2,650);
  g.fillStyle='#231c1d';let fs=60;g.font='600 '+fs+'px Fraunces, Georgia, serif';
  const nombre=(typeof tc==='function'?tc(D.nombre):D.nombre);while(g.measureText(nombre).width>w-80&&fs>34){fs-=2;g.font='600 '+fs+'px Fraunces, Georgia, serif';}
  g.fillText(nombre,W/2,730);
  g.fillStyle='#6d6264';g.font='700 30px Manrope, sans-serif';g.fillText((D.grupo||'').toUpperCase(),W/2,785);
  // QR
  const qr=qrcode(0,'M');qr.addData(QRTEXT);qr.make();const n=qr.getModuleCount(),size=560,cell=size/n,qx=(W-size)/2,qy=830;
  g.fillStyle='#fff';g.fillRect(qx-20,qy-20,size+40,size+40);g.fillStyle='#000';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(qr.isDark(i,j))g.fillRect(qx+j*cell,qy+i*cell,Math.ceil(cell),Math.ceil(cell));
  g.fillStyle='#6d6264';g.font='600 30px Manrope, sans-serif';g.fillText('Código manual',W/2,1475);
  g.fillStyle='#231c1d';g.font='700 66px ui-monospace, Menlo, monospace';g.fillText(String(D.codigo).split('').join(' '),W/2,1550);
  return new Promise(ok=>c.toBlob(ok,'image/png'));
}
$('png').onclick=async()=>{
  const b=$('png');busy(b,true,'Preparando…');
  try{
    const blob=await hacerPNG(),name='Tarjeta_ramo_'+String(D.nombre||'').replace(/[^\wÀ-ÿ]+/g,'_')+'.png',file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Tarjeta de ramo'});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
    toast('Imagen lista');
  }catch(e){if(e&&e.name!=='AbortError')toast('No se pudo crear la imagen: '+e.message,true);}
  finally{busy(b,false);}
};
(async()=>{
  const sp=new URLSearchParams(location.search),codigo=sp.get('codigo')||sp.get('qr');
  try{
    if(!codigo)throw Error('Falta el código de la tarjeta. Abre el enlace que recibiste por correo.');
    const d=await api('tarjeta',{codigo});D=d;
    try{QRTEXT=new URL(d.qrUrl).searchParams.get('text')||'';}catch(_){}
    if(!QRTEXT)QRTEXT='OF50:'+String(d.codigo).replace(/[\s-]/g,'');
    if(d.logo)$('logo').src=d.logo;
    $('date').textContent=d.fecha;$('name').textContent=d.nombre;$('group').textContent=d.grupo;$('code').textContent=d.codigo;
    $('qr').src=d.qrUrl||('https://quickchart.io/qr?size=400&margin=1&text='+encodeURIComponent('OF50:'+d.codigo));
    $('pass').hidden=false;$('actions').hidden=false;
  }catch(e){info(e.message,true);}
  finally{$('loading').hidden=true;}
})();
</script>
</body>
</html>
