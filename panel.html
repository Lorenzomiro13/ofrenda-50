<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>Panel · Ofrenda 50</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:1040px}
.plist{margin-top:14px;border:1px solid #e3e7ee;border-radius:14px;max-height:640px;overflow:auto;background:#fff}
.phead,.prow{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.5fr) 130px 150px 130px;gap:14px;align-items:center;padding:12px 16px}
.phead{position:sticky;top:0;z-index:1;background:#f7f9fc;border-bottom:1px solid #e3e7ee;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6b7280}
.prow{border-bottom:1px solid #eef1f6}
.prow:last-child{border-bottom:0}
.prow:hover{background:#fafbfd}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.ini{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e7ecf5;color:#14284b;font-weight:800;font-size:13px}
.ini.rep{background:#14284b;color:#f3d39b}
.nm{min-width:0}
.nm b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;color:#6b7280;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cargo{font-size:13px;color:#374151;line-height:1.35}
.cargo .badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#14284b;color:#fff;border-radius:5px;padding:2px 6px;margin-bottom:3px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.pill.ok{background:#e1f2e8;color:#1f6b45}.pill.no{background:#eef1f6;color:#4b5563}.pill.pend{background:#fdf0d5;color:#8a5a00}
.ramo{font-size:13px;color:#374151}
.ramo.done{color:#1f6b45;font-weight:700}
.act .btn{min-height:36px;padding:6px 12px;font-size:13.5px;width:100%}
.muted-dash{color:#c0c6d0}
dialog{border:0;border-radius:18px;padding:22px;width:min(440px,calc(100% - 32px));box-shadow:0 20px 60px rgba(15,25,50,.3)}
dialog::backdrop{background:rgba(15,25,50,.45)}
@media(max-width:760px){
  .phead{display:none}
  .prow{grid-template-columns:1fr auto;grid-template-areas:"who est" "cargo cargo" "ramo act";row-gap:8px}
  .prow .who{grid-area:who}.prow .cargo{grid-area:cargo;padding-left:50px}.prow .est{grid-area:est}
  .prow .rcell{grid-area:ramo;padding-left:50px;align-self:center}.rcell .muted-dash{display:none}
  .nm b,.nm small{white-space:normal}.prow .act{grid-area:act}
  .cargo:empty,.ramo:empty{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><img src="https://stgarchivosutd.blob.core.windows.net/mailing/2Mesa_de_trabajo.png" onerror="this.style.visibility='hidden'" alt="">Panel de la Ofrenda</div>
  <nav class="row" style="flex:none;gap:16px"><a href="/lector.html">Lector</a><a href="#" id="logout" hidden>Salir</a></nav>
</div>

<main class="wrap flat">
  <div id="msg" hidden></div>

  <section class="card" id="login" style="max-width:460px;margin:0 auto">
    <div class="step"><span class="n">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </span><h2>Acceso comisión</h2></div>
    <form id="loginForm">
      <label class="lbl" for="pin">PIN de la comisión</label>
      <input id="pin" type="password" autocomplete="current-password" required>
      <button class="btn block lg" id="enter" style="margin-top:18px">Ver panel</button>
    </form>
  </section>

  <section id="content" hidden>
    <div class="row" style="margin-bottom:14px">
      <p class="muted small" id="updated" style="margin:0"></p>
      <button class="btn ghost" id="refresh" type="button" style="flex:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        Actualizar
      </button>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="card" style="margin-top:16px">
      <h2 style="font-size:21px;margin-bottom:12px">Por grupos</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Grupo</th><th>Censo</th><th>Respondido</th><th>Participan</th><th>Flores</th></tr></thead>
        <tbody id="groups"></tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:4px">
        <h2 style="font-size:21px">Falleros <span class="muted" id="count" style="font-family:var(--sans);font-size:16px"></span></h2>
        <button class="btn ghost" id="copy" type="button" style="flex:none">Copiar lista</button>
      </div>
      <div class="chips" id="tabs" role="group" aria-label="Filtrar por estado">
        <button type="button" class="chip" aria-pressed="false" data-f="pend">Sin responder <span id="nPend"></span></button>
        <button type="button" class="chip" aria-pressed="false" data-f="resp">Han respondido <span id="nResp"></span></button>
        <button type="button" class="chip" aria-pressed="false" data-f="rep">Representantes <span id="nRep"></span></button>
        <button type="button" class="chip" aria-pressed="true" data-f="">Todos <span id="nAll"></span></button>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="search" style="flex:2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="find" type="search" placeholder="Buscar nombre o correo" aria-label="Buscar"></div>
        <select id="fgroup" aria-label="Filtrar por grupo" style="flex:1"><option value="">Todos</option><option>Hombres</option><option>Mujeres</option><option>Niños</option><option>Niñas</option></select>
      </div>
      <div class="plist" id="people"></div>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 style="font-size:22px;margin-bottom:6px">Reenviar tarjeta QR</h2>
    <p class="muted" id="dlgName" style="margin:0 0 10px"></p>
    <label class="lbl" for="dlgEmail">Enviar a</label>
    <input id="dlgEmail" type="email" required>
    <p class="notice" style="font-size:13.5px">Se genera un QR nuevo y <b>el anterior deja de valer</b>.</p>
    <div class="row"><button class="btn ghost" value="cancel" formnovalidate type="submit" id="dlgCancel">Cancelar</button><button class="btn" id="dlgSend" type="button">Enviar QR</button></div>
  </form>
</dialog>
<script src="common.js"></script>
<script>
let people=[],filtro='',sel=null,timer=null;
const pct=(a,b)=>b?Math.round(a/b*100):0;
function tile(k,v,of,accent){return `<div class="tile ${accent?'accent':''}"><div class="k">${k}</div><div class="v">${v}${of!=null?` <small>de ${of}</small>`:''}</div>${of!=null?`<div class="meter"><i style="width:${pct(v,of)}%"></i></div>`:''}</div>`;}
async function load(){
  const r=await api('estadisticas',{pin:session.get('pin')});
  $('tiles').innerHTML=
    tile('Han respondido',r.respuestas,r.total,true)+
    tile('Participarán',r.participan)+
    tile('Solicitan flor',r.flores)+
    tile('Ramos entregados',r.entregados,r.flores)+
    tile('Ramos por entregar',Math.max(0,r.flores-r.entregados))+
    tile('Sin responder',r.total-r.respuestas)+
    ((r.representantes||[]).length?tile('Representantes que participan',r.representantes.filter(x=>x.estado==='Asiste').length,r.representantes.length):'');
  $('groups').innerHTML=r.grupos.map(g=>`<tr><td><b>${clean(g.grupo)}</b></td><td class="num">${g.censo}</td><td><div class="minibar"><span class="num">${g.respondido}</span><div class="meter"><i style="width:${pct(g.respondido,g.censo)}%"></i></div></div></td><td class="num">${g.participa}</td><td class="num">${g.flores}</td></tr>`).join('');
  people=r.personas||[];
  $('nAll').textContent=people.length;$('nPend').textContent=people.filter(x=>x.estado==='Sin responder').length;
  $('nResp').textContent=people.filter(x=>x.estado!=='Sin responder').length;$('nRep').textContent=people.filter(x=>x.rep).length;
  showPeople();
  $('updated').textContent='Actualizado a las '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
const EST={'Asiste':'background:var(--ok-soft);color:var(--ok)','No asiste':'background:#eef1f6;color:#4b4f58','Sin responder':'background:var(--warn-soft);color:var(--warn)'};
function filtered(){
  const q=norm($('find').value),g=$('fgroup').value;
  return people.filter(x=>(!g||x.grupo===g)&&
    (filtro!=='pend'||x.estado==='Sin responder')&&(filtro!=='resp'||x.estado!=='Sin responder')&&(filtro!=='rep'||x.rep)&&
    (!q||norm(x.nombre+' '+x.email).includes(q)));
}
function showPeople(){
  const l=filtered();$('count').textContent='· '+l.length;
  const cls={'Asiste':'ok','No asiste':'no','Sin responder':'pend'};
  const head='<div class="phead"><span>Fallero/a</span><span>Representante</span><span>Estado</span><span>Ramo</span><span></span></div>';
  $('people').innerHTML=l.length?head+l.slice(0,400).map(x=>{
    const ramo=x.flor?(x.ramo==='Entregado'?'<span class="ramo done">Entregado</span>':'<span class="ramo">Con flor · pendiente</span>'):(x.estado==='Asiste'?'<span class="ramo">Sin flor</span>':'<span class="muted-dash">—</span>');
    const puede=x.estado==='Asiste'&&x.flor&&x.ramo!=='Entregado';
    const sub=[x.grupo,x.email].filter(Boolean).join(' · ');
    return `<div class="prow">
      <div class="who"><span class="ini ${x.rep?'rep':''}">${clean(initials(x.nombre))}</span><div class="nm"><b title="${clean(x.nombre)}">${clean(tc(x.nombre))}</b><small title="${clean(sub)}">${clean(sub)}</small></div></div>
      <div class="cargo">${x.rep?`<span class="badge">Representante</span><br>${compactRep(x.rep).split(' · ').map(c=>`<span style="white-space:nowrap">${clean(c)}</span>`).join(' · ')}`:''}</div>
      <div class="est"><span class="pill ${cls[x.estado]||'no'}">${clean(x.estado)}</span></div>
      <div class="rcell">${ramo}</div>
      <div class="act">${puede?`<button class="btn ghost" type="button" data-qr="${clean(x.id)}">Reenviar QR</button>`:''}</div>
    </div>`;}).join('')+(l.length>400?'<div class="empty">Mostrando 400. Usa el buscador.</div>':''):'<div class="empty">Nadie con ese filtro.</div>';
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filtro=b.dataset.f;$('tabs').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));showPeople();});
$('find').oninput=showPeople;$('fgroup').onchange=showPeople;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(filtered().map(x=>x.nombre+' ('+x.grupo+')'+(x.rep?' - '+x.rep:'')+' - '+x.estado).join('\n'));toast('Lista copiada');}catch(e){toast('No se pudo copiar',true);}};
$('people').addEventListener('click',e=>{
  const b=e.target.closest('[data-qr]');if(!b)return;sel=people.find(x=>x.id===b.dataset.qr);if(!sel)return;
  $('dlgName').textContent=sel.nombre;$('dlgEmail').value=sel.email||'';$('dlg').showModal();
});
$('dlgSend').onclick=async()=>{
  const email=$('dlgEmail').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Correo no válido',true);return;}
  busy($('dlgSend'),true,'Enviando…');
  try{await api('reenviar',{pin:session.get('pin'),id:sel.id,email});$('dlg').close();toast('QR reenviado a '+email);sel.email=email;}
  catch(err){toast(err.message,true);}finally{busy($('dlgSend'),false);}
};
async function start(){
  $('login').hidden=true;$('content').hidden=false;$('logout').hidden=false;
  try{await load();}catch(e){if(/PIN/i.test(e.message)){session.clear();location.reload();}else info(e.message,true);}
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load().catch(()=>{});},120000);
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();busy($('enter'),true,'Comprobando…');
  try{const pin=$('pin').value.trim();await api('estadisticas',{pin});session.set('pin',pin);$('msg').hidden=true;start();}
  catch(err){info(err.message,true);}finally{busy($('enter'),false);}
});
$('refresh').onclick=async()=>{busy($('refresh'),true,'');try{await load();toast('Datos actualizados');}catch(e){toast(e.message,true);}finally{busy($('refresh'),false);}};
$('logout').addEventListener('click',e=>{e.preventDefault();session.clear();location.reload();});
if(session.get('pin'))start();
</script>
</body>
</html>
